<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-labelledby="t">
<title id="t">Enterprise RAG Assistant: document Q&amp;A with hybrid BM25 and dense retrieval and cross-encoder reranking. Recall@5 improved from 71% to 81%.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1326"/><stop offset="1" stop-color="#150f2b"/></linearGradient>
  <linearGradient id="st" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".7"/><stop offset=".5" stop-color="#334155"/><stop offset="1" stop-color="#f472b6" stop-opacity=".5"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#94a3b8" fill-opacity=".1"/></pattern>
  <clipPath id="fr"><rect x="1" y="1" width="518" height="298" rx="16"/></clipPath>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
  .mono{font-family:'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
  .sh{fill:none;stroke:#a78bfa;stroke-width:2;stroke-linecap:round;stroke-dasharray:9 100;stroke-dashoffset:0;animation:run 7s linear infinite;animation-delay:3.5s}
  @keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
</style>
<g clip-path="url(#fr)">
<rect width="520" height="300" fill="url(#bg)"/>
<rect width="520" height="300" fill="url(#dots)"/>
<circle cx="480" cy="20" r="190" fill="url(#glow)"/>
</g>
<rect x="1" y="1" width="518" height="298" rx="16" fill="none" stroke="url(#st)" stroke-width="1.5"/>
<rect class="sh" x="1" y="1" width="518" height="298" rx="16" pathLength="100" stroke-opacity=".9"/>
<rect x="28" y="26" width="48" height="48" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".5"/>
<g stroke="#a78bfa" stroke-width="1.6" fill="#0b1224">
  <rect x="39" y="35" width="17" height="22" rx="2.5"/>
  <rect x="44" y="39" width="17" height="22" rx="2.5"/>
  <line x1="48" y1="46" x2="57" y2="46"/><line x1="48" y1="51" x2="55" y2="51"/>
  <circle cx="59" cy="58" r="6" fill="#0b1224" stroke-width="2"/>
  <line x1="63.5" y1="62.5" x2="68" y2="67" stroke-width="2.4" stroke-linecap="round"/>
</g>
<text class="sans" x="92" y="50" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="-.3">Enterprise RAG</text>
<text class="sans" x="92" y="72" font-size="14.5" font-weight="600" fill="#a78bfa">Document Q&amp;A with hybrid search</text>
<rect x="444.2" y="30" width="47.8" height="22" rx="11" fill="none" stroke="#a78bfa" stroke-opacity=".6"/>
<text class="mono" x="468.1" y="45" text-anchor="middle" font-size="11" letter-spacing="1.4" fill="#a78bfa" font-weight="700">RAG</text>
<text class="sans" x="28" y="118" font-size="15" fill="#9fb0c3">Answers questions over PDFs and text with</text>
<text class="sans" x="28" y="141" font-size="15" fill="#9fb0c3">source citations, using BM25 + dense hybrid</text>
<text class="sans" x="28" y="164" font-size="15" fill="#9fb0c3">retrieval and cross-encoder reranking.</text>
<g class="mono" font-size="14" font-weight="700">
  <text x="28" y="218"><tspan fill="#94a3b8" font-weight="500">Recall@5  </tspan><tspan fill="#64748b">71%</tspan><tspan fill="#a78bfa">  →  </tspan><tspan fill="#4ade80" font-size="16">81%</tspan><tspan fill="#64748b" font-weight="500" font-size="12.5">   on a 150-question eval set</tspan></text>
</g>
<rect x="28.0" y="246" width="90.6" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
<text class="sans" x="73.3" y="263.5" text-anchor="middle" font-size="12.5" fill="#cbd5e1" font-weight="600">LangChain</text>
<rect x="126.6" y="246" width="61.0" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
<text class="sans" x="157.1" y="263.5" text-anchor="middle" font-size="12.5" fill="#cbd5e1" font-weight="600">FAISS</text>
<rect x="195.6" y="246" width="53.6" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
<text class="sans" x="222.4" y="263.5" text-anchor="middle" font-size="12.5" fill="#cbd5e1" font-weight="600">BM25</text>
<rect x="257.2" y="246" width="112.8" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
<text class="sans" x="313.6" y="263.5" text-anchor="middle" font-size="12.5" fill="#cbd5e1" font-weight="600">Hugging Face</text>
<rect x="378.0" y="246" width="75.8" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
<text class="sans" x="415.9" y="263.5" text-anchor="middle" font-size="12.5" fill="#cbd5e1" font-weight="600">FastAPI</text>
</svg>