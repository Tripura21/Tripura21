<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-labelledby="t">
<title id="t">PlanGenie: multi-agent AI travel planner built with LangChain, FastAPI, React, TypeScript and Supabase.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1326"/><stop offset="1" stop-color="#150f2b"/></linearGradient>
  <linearGradient id="st" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9" stop-opacity=".7"/><stop offset=".5" stop-color="#334155"/><stop offset="1" stop-color="#f472b6" stop-opacity=".5"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#67e8f9" stop-opacity=".18"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#94a3b8" fill-opacity=".1"/></pattern>
  <clipPath id="fr"><rect x="1" y="1" width="518" height="298" rx="16"/></clipPath>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
  .mono{font-family:'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
  .sh{fill:none;stroke:#67e8f9;stroke-width:2;stroke-linecap:round;stroke-dasharray:9 100;stroke-dashoffset:0;animation:run 7s linear infinite;animation-delay:0s}
  @keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
</style>
<g clip-path="url(#fr)">
<rect width="520" height="300" fill="url(#bg)"/>
<rect width="520" height="300" fill="url(#dots)"/>
<circle cx="480" cy="20" r="190" fill="url(#glow)"/>
</g>
<rect x="1" y="1" width="518" height="298" rx="16" fill="none" stroke="url(#st)" stroke-width="1.5"/>
<rect class="sh" x="1" y="1" width="518" height="298" rx="16" pathLength="100" stroke-opacity=".9"/>
<rect x="28" y="26" width="48" height="48" rx="12" fill="#67e8f9" fill-opacity=".1" stroke="#67e8f9" stroke-opacity=".5"/>
<g stroke="#67e8f9" stroke-width="1.6" fill="#0b1224">
  <line x1="52" y1="42" x2="40" y2="60"/><line x1="52" y1="42" x2="52" y2="62"/><line x1="52" y1="42" x2="64" y2="60"/>
  <circle cx="52" cy="41" r="5.5" fill="#67e8f9"/>
  <circle cx="40" cy="61" r="4"/><circle cx="52" cy="63" r="4"/><circle cx="64" cy="61" r="4"/>
</g>
<text class="sans" x="92" y="50" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="-.3">PlanGenie</text>
<text class="sans" x="92" y="72" font-size="14.5" font-weight="600" fill="#67e8f9">Multi-agent AI travel planner</text>
<rect x="392.6" y="30" width="99.4" height="22" rx="11" fill="none" stroke="#67e8f9" stroke-opacity=".6"/>
<text class="mono" x="442.3" y="45" text-anchor="middle" font-size="11" letter-spacing="1.4" fill="#67e8f9" font-weight="700">AI AGENTS</text>
<text class="sans" x="28" y="118" font-size="15" fill="#9fb0c3">An orchestrator agent routes each request to</text>
<text class="sans" x="28" y="141" font-size="15" fill="#9fb0c3">flight, hotel &amp; itinerary agents in parallel,</text>
<text class="sans" x="28" y="164" font-size="15" fill="#9fb0c3">streams results live and edits plans by chat.</text>
<g class="mono" font-size="14" font-weight="700">
  <text x="28" y="218"><tspan fill="#67e8f9">3</tspan><tspan fill="#94a3b8" font-weight="500"> parallel agents</tspan><tspan fill="#475569">   |   </tspan><tspan fill="#67e8f9">7</tspan><tspan fill="#94a3b8" font-weight="500"> edit types</tspan><tspan fill="#475569">   |   </tspan><tspan fill="#94a3b8" font-weight="500">live </tspan><tspan fill="#67e8f9">SSE</tspan></text>
</g>
<rect x="28.0" y="246" width="90.6" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
<text class="sans" x="73.3" y="263.5" text-anchor="middle" font-size="12.5" fill="#cbd5e1" font-weight="600">LangChain</text>
<rect x="126.6" y="246" width="75.8" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
<text class="sans" x="164.5" y="263.5" text-anchor="middle" font-size="12.5" fill="#cbd5e1" font-weight="600">FastAPI</text>
<rect x="210.4" y="246" width="61.0" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
<text class="sans" x="240.9" y="263.5" text-anchor="middle" font-size="12.5" fill="#cbd5e1" font-weight="600">React</text>
<rect x="279.4" y="246" width="98.0" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
<text class="sans" x="328.4" y="263.5" text-anchor="middle" font-size="12.5" fill="#cbd5e1" font-weight="600">TypeScript</text>
<rect x="385.4" y="246" width="83.2" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
<text class="sans" x="427.0" y="263.5" text-anchor="middle" font-size="12.5" fill="#cbd5e1" font-weight="600">Supabase</text>
</svg>